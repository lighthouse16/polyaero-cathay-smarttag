; PlatformIO Project Configuration for PolyAero Cathay SmartTag
; Target Hardware: ESP32-C6 DevKit (16MB N16 / 8MB DevKitC-1 / DevKitM-1),
; Waveshare PN532 NFC HAT, and Waveshare 4.2-inch E-Paper Module V2 (SSD1683, 400x300).

[platformio]
default_envs = esp32-c6-devkitc-1

[env:esp32-c6-devkitc-1]
platform = espressif32
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200

; Host protocol tests remain cleanly excluded from embedded build via src_filter
build_src_filter =
  +<*.c>
  +<*.cpp>
  -<test/>

lib_deps =
  adafruit/Adafruit PN532 @ ^1.3.3
  zinggjm/GxEPD2 @ ^1.5.9
  adafruit/Adafruit GFX Library @ ^1.11.9

build_flags =
  -D SMARTTAG_FW_VERSION=\"2.1.0\"
  ; Configure PN532 transport mode (I2C recommended to avoid SPI contention with E-Paper)
  -D PN532_MODE_I2C=1
  ; Waveshare 4.2" E-Paper V2 (SSD1683) is default; uncomment V1 below for legacy IL0398 panels
  ; -D EPD_WAVESHARE_420_V1=1
  ; Proposed non-strapping breadboard GPIO assignments (UNVERIFIED UNTIL PHYSICAL BENCH CHECK)
  ; Avoids ESP32-C6 strapping pins (GPIO4, 5, 8, 9, 15) and native USB D-/D+ (GPIO12, 13)
  -D PIN_EPD_CS=18
  -D PIN_EPD_DC=19
  -D PIN_EPD_RST=20
  -D PIN_EPD_BUSY=21
  -D PIN_EPD_SCK=10
  -D PIN_EPD_MOSI=11
  -D PIN_PN532_SDA=6
  -D PIN_PN532_SCL=7
  -D PIN_PN532_IRQ=2
  -D PIN_PN532_RST=3
  -D PIN_PN532_CS=0
  -D PIN_PN532_MISO=1
